# Draft entry for the AXI catalog (https://github.com/kunchenguid/axi).
#
# The item under `community:` is what goes into that repo's catalog.yaml,
# appended to its `community` list; `pnpm run docs:gen` there regenerates the
# README and docs/index.html tables from it. That PR is the owner's.
#
# reviewed_revision is the commit tag v1.1.2 points at. Every
# source_observations line cites file:line at that commit, and "Observed" means
# run on a `make build` of it (re-observed 2026-11-23, EST-8353).

community:
  - name: llm-filesystem-axi
    url: https://github.com/samestrin/llm-filesystem-axi
    author: samestrin
    domain: Filesystem
    description: "Read, write, edit, search and archive local files from one static Go binary, with TOON output, capped reads that name the next offset, and `--confirm` on destructive operations. Includes an MCP wrapper."
    admission:
      status: exception
      reviewed_revision: 299cc3a11fefb8588c8a8e50ceef2e269345a9ce
      reviewed_components:
        - cmd/llm-filesystem/main.go
        - cmd/llm-filesystem-mcp/main.go
        - internal/filesystem/commands/root.go
        - internal/filesystem/commands/output.go
        - internal/filesystem/commands/home.go
        - internal/filesystem/commands/read.go
        - internal/filesystem/commands/search.go
        - internal/filesystem/commands/fileops.go
        - internal/filesystem/commands/write.go
        - internal/filesystem/commands/setup.go
        - internal/filesystem/core/read.go
        - internal/filesystem/core/search.go
        - internal/filesystem/core/fileops.go
        - internal/filesystem/core/write.go
        - internal/filesystem/core/utils.go
        - internal/filesystem/mcpserver/server.go
        - internal/filesystem/mcpserver/tools.go
        - internal/filesystem/mcpserver/handlers.go
        - internal/filesystem/mcpserver/binary.go
        - integrations/claude-code/skill/SKILL.md
        - integrations/claude-code/skill/embed.go
      source_observations:
        - "cmd/llm-filesystem/main.go:6 calls commands.Execute; internal/filesystem/commands/root.go:170-171 defaults --format to toon, and root.go:193-197 declares -v, -V (shorthand only) and --version on the root command, which print the bare version and exit 0 (observed: one line, the version `make build` stamps from `git describe`, and nothing else)."
        - "root.go:582-585 renders cobra's parse failures (unknown command, unknown flag, missing required flag) through emitDiagnostic with exit 2, and OutputError (root.go:490-501) renders tool failures the same way with exit 1, or exit 2 when core refused the request before attempting it. emitDiagnostic (root.go:459-483) writes the whole diagnostic to stdout in every format (root.go:481), and execute reads --format from the arguments itself (root.go:584), so flag order does not matter. Observed: `read-file --bogus` exits 2 and `read-file --path /nope` exits 1, each with 0 bytes on stderr, and with --format text before or after the other flags both still write their diagnostic to stdout and 0 bytes to stderr."
        - "internal/filesystem/commands/home.go:121 runHome is the no-argument view: about, bin, cwd and home (abbreviated to ~ by tildePath, home.go:45 and home.go:73-92), a listing of the working directory with total, and help[] next steps; it exits 0."
        - "internal/filesystem/core/read.go:15 caps a read at 70000 chars by default, and internal/filesystem/commands/read.go:70-81 adds a `--start-offset` continue step when the read is truncated. Observed: a 99001-byte file reads as size: 70000, total_size: 99001, truncated: true, next_offset: 70000, with help[] naming `--start-offset 70000`."
        - "internal/filesystem/commands/fileops.go:188-190 makes --confirm required for delete-file, and fileops.go:160-165 refuses --confirm=false with exit 2 and a step naming the confirmed command. move-file and copy-file refuse to replace an existing destination without --confirm (refuseUnconfirmedOverwrite, fileops.go:32-47, called at fileops.go:81 and fileops.go:117), and batch-file-operations refuses a delete, or a move or copy onto an existing path, without it (fileops.go:257-280). write-file (write.go:24) replaces an existing file without --confirm (core/write.go:66 opens it with O_TRUNC). Even with --confirm, delete-file refuses the filesystem root, HOME, the working directory and any directory holding one of them, with exit 2 (CheckDeletable, internal/filesystem/core/utils.go:212-244). Observed: delete-file, move-file and copy-file without --confirm each exit 2 and leave the files as they were; `delete-file --path . --recursive --confirm` exits 2 and the working directory is still there; write-file onto an existing file exits 0 and the file holds the new content."
        - "internal/filesystem/core/search.go:108-111 and core/search.go:277-289 keep counting past --max-results (default 1000, commands/search.go:78 and commands/search.go:171), so total and total_matches are exact; core/search.go:136-139 and core/search.go:307-310 add shown and truncated: true when the cap cut the list, and commands/search.go:182-185 adds a help[] line naming the --max-results that lists them all. A search with no match prints matches[0]: (JSON []) beside a total of 0 (core/search.go:78-79 and core/search.go:241-242). Observed: a file with 1500 matching lines gives total_matches: 1500, shown: 1000, truncated: true and `Showing 1000 of 1500: raise --max-results (e.g. --max-results 1500)`, exit 0."
        - "internal/filesystem/commands/setup.go:104 `setup` registers with Claude Code, Codex and OpenCode in the working directory: it merges a SessionStart hook into .claude/settings.json and into .codex/hooks.json (setup.go:239 and setup.go:245), writes the skill to .claude/skills/llm-filesystem/SKILL.md (setup.go:251; the content is integrations/claude-code/skill/SKILL.md, embedded by integrations/claude-code/skill/embed.go:13-14), and writes an OpenCode plugin to .opencode/plugins/llm-filesystem.js (setup.go:263). The hook runs the bare `llm-filesystem` only when that name on PATH is this binary, and the absolute path otherwise (setup.go:296-312). It refuses to run in the home directory (setup.go:202-206). Observed: in an empty project it writes those four files and exits 0; in the home directory it exits 1 and writes nothing. No session-end hook is set up."
        - "cmd/llm-filesystem-mcp/main.go:23-50 starts the MCP stdio server llm-filesystem-mcp. internal/filesystem/mcpserver/server.go:20-49 registers one tool per CLI command, named with the llm_filesystem_ prefix (mcpserver/tools.go:25) and skipping completion, help and setup (mcpserver/tools.go:31); each call runs the CLI binary (mcpserver/handlers.go:65-101), found through LLM_FILESYSTEM_BINARY, then PATH, then beside the server (mcpserver/binary.go:27-67). A non-zero exit is an MCP error result carrying the CLI's own output and exit_code (mcpserver/handlers.go:96-97 and 115-116). Observed: tools/list returns 28 tools; llm_filesystem_read_file on a missing path returns isError: true with the CLI's TOON error and `exit_code: 1`."
      exception: "Principle 7: `setup` registers Claude Code (a SessionStart hook in the project's .claude/settings.json plus the skill), Codex (a SessionStart hook in the project's .codex/hooks.json) and OpenCode (a plugin in the project's .opencode/plugins/ that adds the home view to the system context); there is no session-end capture, because this CLI keeps no session history. Principle 6: write-file replaces an existing destination without --confirm; delete-file requires it, and so do move-file and copy-file when the destination already exists, compress-files when --output already exists, sync-directories when it would replace a file in the destination, and any batch-file-operations entry that destroys something: a delete, or a move or copy onto a path that already exists."
